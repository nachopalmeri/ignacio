<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Launch film</title>
<style>
  @font-face { font-family: Inter; font-weight: 400; src: url(fonts/inter-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Inter; font-weight: 500; src: url(fonts/inter-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: Inter; font-weight: 600; src: url(fonts/inter-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: Inter; font-weight: 700; src: url(fonts/inter-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: Serif; font-style: normal; src: url(fonts/instrument-serif-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Serif; font-style: italic; src: url(fonts/instrument-serif-latin-400-italic.woff2) format('woff2'); }
  @font-face { font-family: Mono; font-weight: 500; src: url(fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2'); }

  :root { --bg: #f3f0e8; --ink: #191919; --muted: #6b675f; --accent: #5b45f0; --accent-soft: #ece8ff; --card: #fff; --chip: #fff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: Inter, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
  .layer { position: absolute; inset: 0; will-change: transform, opacity, filter; }
  .abs { position: absolute; }
  .center { position: absolute; left: 50%; top: 50%; }
  img { display: block; user-select: none; }

  .blob { position: absolute; border-radius: 50%; }
  .grain { position: absolute; inset: -50px; opacity: var(--grain-o, .035); mix-blend-mode: var(--grain-blend, multiply); pointer-events: none; }

  .headline { position: absolute; left: 0; right: 0; text-align: center; font-weight: 600; font-size: 66px; letter-spacing: -0.035em; line-height: 1.08; }
  .headline em, .serif { font-family: Serif; font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
  .headline em { color: var(--accent); font-size: 1.12em; }
  .w { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }

  .window { position: absolute; border-radius: 18px; overflow: hidden; background: #fff;
    box-shadow: 0 2px 0 rgba(255,255,255,.6) inset, 0 0 0 1px rgba(20,20,30,.08), 0 40px 90px -20px rgba(30,25,60,.28), 0 18px 40px -18px rgba(30,25,60,.25); }
  .window .bar { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 18px; background: #f7f6f3; border-bottom: 1px solid rgba(0,0,0,.06); }
  .window .dot { width: 12px; height: 12px; border-radius: 50%; }
  .window .url { margin: 0 auto; transform: translateX(-30px); padding: 6px 18px; border-radius: 8px; background: #ecebe6; font: 500 14px Mono, monospace; color: #55524b; }
  .window .view { position: absolute; left: 0; right: 0; top: 44px; bottom: 0; overflow: hidden; }
  .window .view img { position: absolute; left: 0; top: 0; width: 100%; }
  .window.dark .bar { background: #1b1b22; border-color: rgba(255,255,255,.06); }
  .window.dark .url { background: #2a2a33; color: #b9b7c7; }

  .card { position: absolute; border-radius: 20px; overflow: hidden; background: var(--card);
    box-shadow: 0 0 0 1px rgba(20,20,30,.06), 0 30px 60px -24px rgba(30,25,60,.30), 0 10px 24px -12px rgba(30,25,60,.18); }
  .card img { width: 100%; height: 100%; }

  .chip { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border-radius: 999px; background: var(--chip); color: var(--ink); font: 600 22px Inter; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 10px 24px -12px rgba(0,0,0,.25); }
  .kicker { font: 600 20px Mono, monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }

  .cursor { position: absolute; width: 34px; height: 34px; z-index: 50; filter: drop-shadow(0 4px 6px rgba(0,0,0,.3)); }
  .ripple { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 3px solid var(--accent); z-index: 49; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
  import { boot } from './engine.mjs';
  const id = new URLSearchParams(location.search).get('film');
  const mod = await import(`./films/${id}.mjs`);
  window.__film = await boot(document.getElementById('stage'), mod.film, `assets/${id}/`);
  window.__ready = true;
</script>
</body>
</html>
